# Template — rendered to app.yaml by scripts/deploy.sh from config.env (envsubst).
# App A URL is discovered at runtime BY NAME (portable). ${DATABRICKS_APP_PORT:-8080} is runtime.
command: ["sh", "-c", "uvicorn server:app --host 0.0.0.0 --port ${DATABRICKS_APP_PORT:-8080}"]
env:
  - name: AGENT_APP_NAME
    value: "sentiva-agent-api"
